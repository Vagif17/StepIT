{% extends "base.html" %}

{% block title %}Удаление события{% endblock %}

{% block content %}

<div class="confirm-card">
    <div class="confirm-card__icon">!</div>
    <h1>Удалить событие?</h1>
    <p>Вы уверены, что хотите удалить «{{ event.title }}»? Это действие нельзя отменить.</p>

    <form method="post" class="confirm-card__actions">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'events:detail' event.id %}" class="btn btn-outline">Отмена</a>
    </form>
</div>

{% endblock %}
