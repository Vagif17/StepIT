
services:

  frontend:
    build:
      context: ./Frontend/docker5

    ports:
      - "5173:5173"

    depends_on:
      - backend


  backend:
    build:
      context: ./API/docker5

    ports:
      - "5216:8080"

    depends_on:
      - mssql

    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=mssql;Database=Docker5Db;User Id=sa;Password=Your_password123!;TrustServerCertificate=True;


  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest

    container_name: mssql

    environment:
      SA_PASSWORD: "Your_password123!"
      ACCEPT_EULA: "Y"

    ports:
      - "1433:1433"

    volumes:
      - sql_data:/var/opt/mssql


volumes:
  sql_data: